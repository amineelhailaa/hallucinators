name: Deploy Hallucinators to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run build
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/hallucinators/' }}
      - run: npm run check:bundle
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
        env:
          TEST_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/hallucinators/' }}
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
  python-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: examples/requirements.txt
      - run: pip install -r examples/requirements.txt
      - run: python examples/cnn.py --task classification --epochs 1 --output /tmp/classification
      - run: python examples/cnn.py --task regression --epochs 1 --output /tmp/regression
        env:
          TF_NUM_INTRAOP_THREADS: "2"
          TF_NUM_INTEROP_THREADS: "2"

  deploy:
    needs: [build, python-examples]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
